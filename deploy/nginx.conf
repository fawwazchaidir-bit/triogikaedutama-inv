# Alternatif Nginx (+ certbot). Salin ke /etc/nginx/sites-available/fms, ganti domain, lalu:  sudo certbot --nginx -d <domain>
# Aplikasi mendengarkan di 127.0.0.1:3000 dan TRUST_PROXY=true → proxy WAJIB menimpa header X-Forwarded-*.
server {
  listen 80;
  server_name fms-staging.trilogikaedutama.id;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name fms-staging.trilogikaedutama.id;
  # ssl_certificate / ssl_certificate_key diisi certbot.

  client_max_body_size 4m;                       # unggahan maks 3 MB + overhead multipart
  server_tokens off;

  # Opsional (disarankan untuk staging): batasi ke IP kantor/VPN.
  # allow 203.0.113.10; allow 198.51.100.0/24; deny all;

  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;   # menimpa; JANGAN pakai $proxy_add_x_forwarded_for
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 60s;
  }
}
